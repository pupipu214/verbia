services:
  - type: web
    name: verbia-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      # Render proporciona PORT automaticamente; no fijarlo manualmente.
      # Variables de API (configurar en dashboard de Render)
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false  # Pegar aquí tu URL de Supabase desde .env
      - key: FISH_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Render generará automáticamente un valor seguro
      - key: SESSION_SECRET
        generateValue: true
      # Entorno de producción
      - key: ENVIRONMENT
        value: production
      # Configurar después del despliegue con la URL real
      - key: CORS_ORIGINS
        sync: false
