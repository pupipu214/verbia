<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Verbo, la mascota virtual de Verbai.">
  <title>Verbo | Mascota interactiva</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7fb;
      --ink: #27213a;
      --violet-soft: #eee8ff;
      --mint-soft: #e6f6ef;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0f172a;
      --ink: #f1f5f9;
      --violet-soft: #1e293b;
      --mint-soft: #172033;
    }

    /* Verbo flota sin caja: iframe y SVG siempre transparentes. */
    html,
    html body,
    html.is-embedded,
    html.is-embedded body,
    body.is-embedded {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html {
      background: transparent !important;
      background-color: transparent !important;
    }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
      color: var(--ink);
    }

    /* En movil forzar transparencia absoluta para evitar fondo blanco del iframe */
    @media (hover: none), (max-width: 760px) {
      html, body {
        background: transparent !important;
        background-color: transparent !important;
      }
    }

    .brand-lockup {
      position: fixed;
      top: 18px;
      left: 50%;
      z-index: 10;
      width: min(220px, 50vw);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .brand-lockup img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 18px rgba(30, 41, 59, 0.12));
    }

    .verbo-stage {
      display: grid;
      width: min(340px, 76vw);
      aspect-ratio: 12 / 13;
      place-items: center;
      animation: float 4.2s ease-in-out infinite;
      padding-top: 54px;
    }
    .is-embedded .verbo-stage { width: 100%; height: 100%; aspect-ratio: auto; padding-top: 0; }
    .is-embedded .brand-lockup { display: none; }

    .verbo-stage,
    .verbo-svg {
      background: transparent !important;
      background-color: transparent !important;
    }

    .verbo-svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .verbo-svg.expression-curious { animation: curious 1.2s ease-in-out infinite alternate; }
    .verbo-svg.expression-explain { animation: explain 1.8s ease-in-out infinite; }
    .verbo-svg.expression-goodbye { animation: goodbye 1.1s ease-in-out 3; }
    .wing-wave { transform-box: fill-box; transform-origin: center; }
    .expression-goodbye .wing-wave { animation: wing-wave .35s ease-in-out 6 alternate; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes curious { to { transform: rotate(4deg) translateY(-3px); } }
    @keyframes explain { 50% { transform: translateY(-5px) scale(1.015); } }
    @keyframes goodbye { 50% { transform: rotate(-5deg) translateY(-7px); } }
    @keyframes wing-wave { to { transform: rotate(-28deg) translateY(-4px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="brand-lockup" aria-label="Logo de VerbAI">
    <img id="brand-logo" src="static/img/verbai-logo-final.svg" alt="Logo de VerbAI" />
  </div>

  <main class="verbo-stage" aria-label="Verbo, mascota interactiva de Verbai">
    <svg class="verbo-svg" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="verbo-title verbo-description">
      <title id="verbo-title">Verbo, tu mascota de comunicacion</title>
      <desc id="verbo-description">Un pajaro morado con audifonos y microfono.</desc>
      <defs>
        <linearGradient id="bodyGrad" x1="30%" y1="0%" x2="70%" y2="100%">
          <stop offset="0%" stop-color="#B794F6"/><stop offset="55%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#6D28D9"/>
        </linearGradient>
        <linearGradient id="headGrad" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#C4B5FD"/><stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
        <linearGradient id="bellyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#FFF7E6"/><stop offset="100%" stop-color="#FDE68A"/>
        </linearGradient>
        <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#4C1D95"/>
        </linearGradient>
        <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FCD34D"/><stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
        <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#4338CA"/><stop offset="100%" stop-color="#1E1B4B"/>
        </linearGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E1B4B" flood-opacity="0.18"/>
        </filter>
        <radialGradient id="shine" cx="35%" cy="25%" r="60%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <g filter="url(#softShadow)">
        <path d="M 100 215 Q 82 245 92 252 Q 102 240 108 220 Z" fill="#5B21B6"/>
        <path d="M 120 218 Q 118 250 128 254 Q 132 238 130 220 Z" fill="#6D28D9"/>
        <path d="M 140 215 Q 158 245 148 252 Q 138 240 132 220 Z" fill="#5B21B6"/>
      </g>

      <g fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round">
        <path d="M 96 220 L 92 235 M 96 220 L 100 235 M 96 220 L 88 232"/>
        <path d="M 144 220 L 140 235 M 144 220 L 148 235 M 144 220 L 152 232"/>
      </g>

      <g filter="url(#softShadow)">
        <path d="M 120 32 C 74 32 54 68 54 104 C 54 118 50 128 46 142 C 38 176 50 212 86 224 C 105 232 135 232 154 224 C 190 212 202 176 194 142 C 190 128 186 118 186 104 C 186 68 166 32 120 32 Z" fill="url(#bodyGrad)"/>
      </g>

      <path d="M 120 32 C 74 32 54 68 54 104 C 54 118 50 128 46 142 C 38 176 50 212 86 224 C 105 232 135 232 154 224 C 190 212 202 176 194 142 C 190 128 186 118 186 104 C 186 68 166 32 120 32 Z" fill="url(#shine)"/>
      <ellipse cx="120" cy="175" rx="46" ry="42" fill="url(#bellyGrad)" opacity="0.9"/>

      <g filter="url(#softShadow)">
        <path d="M 58 138 C 42 158 42 188 58 202 C 70 210 82 200 80 180 C 78 158 70 142 58 138 Z" fill="url(#wingGrad)"/>
        <path d="M 52 165 Q 65 168 72 158 M 52 180 Q 66 182 74 172" stroke="#3B0764" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
      </g>
      <g filter="url(#softShadow)">
        <path class="wing-wave" d="M 182 138 C 196 156 196 186 180 198 C 170 204 160 196 162 178 C 164 158 172 142 182 138 Z" fill="url(#wingGrad)"/>
        <path d="M 188 165 Q 176 168 168 158 M 188 180 Q 174 182 166 172" stroke="#3B0764" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
      </g>

      <g filter="url(#softShadow)">
        <path d="M 108 32 Q 105 18 116 14 Q 120 24 118 32 Z" fill="#C4B5FD"/>
        <path d="M 120 30 Q 122 12 134 14 Q 132 24 126 30 Z" fill="#B794F6"/>
        <path d="M 130 34 Q 138 20 148 24 Q 142 32 136 38 Z" fill="#A78BFA"/>
      </g>

      <ellipse cx="82" cy="112" rx="13" ry="8" fill="#FB7185" opacity="0.45"/>
      <ellipse cx="158" cy="112" rx="13" ry="8" fill="#FB7185" opacity="0.45"/>

      <g id="verbo-eyes">
        <ellipse id="pupil-left" cx="96" cy="95" rx="16" ry="18" fill="#1E1B4B"/>
        <circle cx="101" cy="88" r="6" fill="#FFFFFF"/>
        <circle cx="90" cy="102" r="2.5" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="93" cy="99" r="3" fill="#A78BFA" opacity="0.6"/>
        <ellipse id="pupil-right" cx="144" cy="95" rx="16" ry="18" fill="#1E1B4B"/>
        <circle cx="149" cy="88" r="6" fill="#FFFFFF"/>
        <circle cx="138" cy="102" r="2.5" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="141" cy="99" r="3" fill="#A78BFA" opacity="0.6"/>
      </g>

      <g filter="url(#softShadow)">
        <path d="M 108 122 Q 120 116 132 122 Q 132 138 120 144 Q 108 138 108 122 Z" fill="url(#beakGrad)"/>
        <path d="M 108 128 Q 120 132 132 128" stroke="#B45309" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="115" cy="124" rx="3" ry="1.5" fill="#FFFFFF" opacity="0.6"/>
      </g>

      <g filter="url(#softShadow)">
        <path d="M 58 95 Q 58 42 120 42 Q 182 42 182 95" fill="none" stroke="url(#phoneGrad)" stroke-width="11" stroke-linecap="round"/>
        <path d="M 58 95 Q 58 42 120 42 Q 182 42 182 95" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" opacity="0.6" transform="translate(0, -3)"/>
        <rect x="40" y="84" width="30" height="42" rx="14" fill="url(#phoneGrad)"/>
        <rect x="46" y="90" width="18" height="30" rx="9" fill="#312E81" opacity="0.7"/>
        <ellipse cx="55" cy="105" rx="5" ry="8" fill="#6366F1" opacity="0.5"/>
        <rect x="170" y="84" width="30" height="42" rx="14" fill="url(#phoneGrad)"/>
        <rect x="176" y="90" width="18" height="30" rx="9" fill="#312E81" opacity="0.7"/>
        <ellipse cx="185" cy="105" rx="5" ry="8" fill="#6366F1" opacity="0.5"/>
      </g>

      <g filter="url(#softShadow)">
        <path d="M 185 118 Q 175 148 158 152" fill="none" stroke="#1E1B4B" stroke-width="4" stroke-linecap="round"/>
        <circle cx="156" cy="153" r="9" fill="#1E1B4B"/>
        <circle cx="156" cy="153" r="5" fill="#4338CA"/>
        <circle cx="154" cy="150" r="2" fill="#FFFFFF" opacity="0.6"/>
      </g>
    </svg>
  </main>

  <script>
    (function () {
      'use strict';

      const savedTheme = localStorage.getItem('verbai-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }

      if (new URLSearchParams(window.location.search).has('embed')) {
        document.documentElement.classList.add('is-embedded');
        document.body.classList.add('is-embedded');
      }

      window.addEventListener('storage', function (event) {
        if (event.key === 'verbai-theme' && (event.newValue === 'light' || event.newValue === 'dark')) {
          document.documentElement.dataset.theme = event.newValue;
        }
      });

      const leftPupil = document.querySelector('#pupil-left');
      const rightPupil = document.querySelector('#pupil-right');
      const pupils = [leftPupil, rightPupil].filter(Boolean);

      function moveVerboEyes(pointerX, pointerY) {
        const normalizedX = (pointerX - window.innerWidth / 2) / (window.innerWidth / 2 || 1);
        const normalizedY = (pointerY - window.innerHeight / 2) / (window.innerHeight / 2 || 1);
        const offsetX = Math.max(-5, Math.min(5, normalizedX * 5));
        const offsetY = Math.max(-4, Math.min(4, normalizedY * 4));

        pupils.forEach(function (pupil) {
          pupil.setAttribute('transform', 'translate(' + offsetX + ' ' + offsetY + ')');
        });
      }

      function resetVerboEyes() {
        pupils.forEach(function (pupil) {
          pupil.setAttribute('transform', 'translate(0 0)');
        });
      }

      function handlePointerMove(event) {
        moveVerboEyes(event.clientX, event.clientY);
      }

      document.addEventListener('pointermove', handlePointerMove, { passive: true });
      window.addEventListener('blur', resetVerboEyes);

      window.addEventListener('message', function (event) {
        if (event.source !== window.parent || !event.data || event.data.type !== 'verbo-expression') return;

        const expressions = ['curious', 'explain', 'goodbye'];
        if (!expressions.includes(event.data.expression)) return;

        const svg = document.querySelector('.verbo-svg');
        svg.classList.remove('expression-curious', 'expression-explain', 'expression-goodbye');
        svg.classList.add('expression-' + event.data.expression);

        const pupils = document.querySelectorAll('#pupil-left, #pupil-right');
        pupils.forEach(function (pupil) {
          pupil.setAttribute('ry', event.data.expression === 'goodbye' ? '4' : '18');
          pupil.setAttribute('transform', event.data.expression === 'explain' ? 'translate(0 -2)' : 'translate(0 0)');
        });
      });
    })();
  </script>
</body>
</html>
